[project]
name = "agentic-rtl-assistant"
version = "0.1.0"
description = "A configuration-driven, graph-grounded assistant for Verilog RTL projects"
readme = "README.md"
authors = [
    { name = "KirollosEMH", email = "21P0006@eng.asu.edu.eg" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.11",
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pyverilog>=1.3.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
]

[project.scripts]
rtl-assistant = "agentic_rtl_assistant.main:main"
agentic-rtl-assistant = "agentic_rtl_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
