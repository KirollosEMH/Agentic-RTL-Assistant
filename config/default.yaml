project:
  root: descriptive_verilog_design
  verilog_extensions: [.v, .sv]
  ignored_paths: [.git, .venv, build, runs]

approach:
  type: multi_agent_graphrag

orchestration:
  max_steps: 12
  max_repair_attempts: 2
  timeout_seconds: 120
  agents:
    intent_classifier:
      model: fast
      temperature: 0.0
      prompt: prompts/intent_classifier.md
    single_agent:
      model: reasoning
      temperature: 0.0
      prompt: prompts/single_agent.md
    rtl_explanation:
      model: reasoning
      temperature: 0.1
      prompt: prompts/rtl_explanation.md
    rtl_codegen:
      model: coding
      temperature: 0.1
      prompt: prompts/rtl_codegen.md
    rtl_repair:
      model: coding
      temperature: 0.0
      prompt: prompts/rtl_repair.md

models:
  profiles:
    fast: {provider: ollama, model: gpt-oss:120b, timeout_seconds: 180, retries: 1}
    reasoning: {provider: ollama, model: gpt-oss:120b, timeout_seconds: 300, retries: 1}
    coding: {provider: ollama, model: gpt-oss:120b, timeout_seconds: 300, retries: 1}
  providers:
    openai:
      api_key_env: OPENAI_API_KEY
    ollama:
      base_url: https://ollama.com/v1/
      api_key_env: OLLAMA_API_KEY
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    groq:
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY

knowledge:
  graph:
    backend: memory
    build_mode: lazy
    extracted_node_types: [file, module, port, instance]
    relationship_types: [defines, has_port, has_instance, instantiates, instance_of]
  graphrag:
    max_hops: 2
    max_nodes: 24
    max_source_chunks: 6
    max_context_tokens: 4000
    include_graph_facts: true
    include_source_evidence: true
  text_rag:
    chunking_strategy: rtl_semantic
    max_chunks: 6
    max_chunk_tokens: 1200

rtl:
  parser_backend: pyverilog
  validation:
    parser_check: true
  filesystem:
    allow_reads: true
    allow_writes: true
    require_confirmation_for_write: true

context:
  max_conversation_messages: 12
  max_resolved_entities: 24
  max_evidence_items: 12
  token_budget:
    max_request_tokens: 8000
    max_evidence_tokens: 4000

telemetry:
  enabled: true
  persistence_path: runs

evaluation:
  datasets: [evals/cases/required.yaml]
  metrics: [correctness, grounding, retrieval, tokens, latency, validation]
  repetitions: 1
  approaches: [direct_llm, text_rag, single_agent, multi_agent_rag, multi_agent_graphrag]
  model_profiles: [reasoning]

ui:
  type: textual
  show_execution_panel: true
  show_token_panel: true
  show_metrics_panel: true
  show_agent_activity: true
  show_tool_activity: true
