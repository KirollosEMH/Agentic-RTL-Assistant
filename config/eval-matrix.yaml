# Cross-product evaluation: every approach is run with every named model profile below.
# Ollama and OpenRouter credentials come from .env.
models:
  profiles:
    ollama_gpt_oss_120b:
      provider: ollama
      model: gpt-oss:120b
      timeout_seconds: 300
      retries: 1

    ollama_nemotron_3_super:
      provider: ollama
      model: nemotron-3-super
      timeout_seconds: 300
      retries: 1

    openrouter_nemotron_3_ultra:
      provider: openrouter
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      timeout_seconds: 300
      retries: 1

    openrouter_gemma_4:
      provider: openrouter
      model: google/gemma-4-31b-it:free
      timeout_seconds: 300
      retries: 1

  providers:
    ollama:
      base_url: https://ollama.com/v1/
      api_key_env: OLLAMA_API_KEY
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY

evaluation:
  approaches:
    - direct_llm
    - text_rag
    - single_agent
    - multi_agent_rag
    - multi_agent_graphrag
  model_profiles:
    - ollama_gpt_oss_120b
    - ollama_nemotron_3_super
    - openrouter_nemotron_3_ultra
    - openrouter_gemma_4

telemetry:
  persistence_path: runs/matrix
